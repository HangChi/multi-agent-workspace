[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
# 临时目录固定在仓库内，不用系统 /var/folders。
# 原因（2026-11-19 实测）：在受限 sandbox（如某些 CLI 运行环境）里，
# pytest 创建 /private/var/folders/.../pytest-of-<user> 会被拦截并抛
# FileExistsError，表现为「跑全量时总有 1 个 error」，看起来像代码坏了。
# 固定到 .pytest-tmp 后与系统临时目录无关。
addopts = --basetemp=.pytest-tmp
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: 集成测试（依赖真实 DB/Redis/MinIO fixture）

# 覆盖率口径在 backend/.coveragerc —— pytest-cov 不读本文件的 [coverage:run]
# 段（只认 .coveragerc / setup.cfg / tox.ini / pyproject.toml）。
# 曾经写在这里的后果：concurrency 声明被静默忽略，所有碰 DB 的服务层
# 覆盖率被系统性低估（29% vs 实际 78%），门禁在测一个假数字。
#
# 怎么跑：
#   pytest                                   # 快速循环，不算覆盖率
#   pytest --cov=app --cov-report=term       # 带门禁（fail_under 在 .coveragerc）
