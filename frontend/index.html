<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d17" media="(prefers-color-scheme: dark)" />
    <title>Agent 工作台</title>
    <!-- 正文字体只覆盖拉丁区（约 30KB），首屏优先拉取，避免标题/数字先回退再跳字 -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- 防闪白脚本外链：内联脚本会逼 CSP 放开 script-src 'unsafe-inline'。
         放在 <head> 且不加 defer，确保在主 bundle 之前执行。 -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
