<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d17" media="(prefers-color-scheme: dark)" />
    <title>Agent 工作台</title>
    <script>
      /**
       * 首屏防闪白：在样式与脚本加载前就把 .dark 打到 <html> 上。
       * 读取的是 zustand persist 的结构 { state: { mode } }，与 themeStore 保持一致。
       */
      (function () {
        try {
          var raw = localStorage.getItem('aw_theme')
          var mode = raw ? JSON.parse(raw).state.mode : 'system'
          var dark =
            mode === 'dark' ||
            ((mode === 'system' || !mode) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* 隐私模式等场景读不到 localStorage，忽略即可 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
