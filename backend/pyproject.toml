[project]
name = "agent-workbench-backend"
version = "0.2.0"
description = "Agent 工作台系统后端（FastAPI + SQLAlchemy async + Celery）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "celery>=5.4",
    "redis>=5.0",
    "litellm>=1.40",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.1",
    "bcrypt>=4.1",
    "structlog>=24.1",
    "httpx>=0.27",
    "minio>=7.2",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # 沙箱执行：通过 Docker SDK 起一次性容器（research R-01）。只用 SDK，
    # 不引入 docker-compose / podman 等第二套容器设施。
    "docker>=7.1",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # 仅给「运行期版本矩阵」用：3.15 上有几个集成用例对异步时序敏感
    # （单跑必过、全量偶发红），CI 只在该版本上允许重试，3.12 保持严格。
    "pytest-rerunfailures>=14.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # 011 浏览器走查验收（s12）：只进 dev extras——Dockerfile 是
    # uv sync --locked --no-dev，生产镜像不装（运行时不变量不受影响）。
    # 安装需经代理（沙箱直连 pythonhosted 502）：HTTPS_PROXY=...:7897。
    "playwright>=1.40",
]
# 异常上报（可选）。不在主依赖里：SENTRY_DSN 为空时应用完全不 import 它，
# 装了也只是多几十 MB 依赖。要用时 `pip install -e '.[sentry]'` 并填 DSN。
# 三个 extra 分别对应 FastAPI 请求、SQLAlchemy 查询、Celery 任务三个层次。
sentry = [
    "sentry-sdk[fastapi,sqlalchemy,celery]>=2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.core.config"]
disallow_untyped_defs = false

# docker-py 7.x 不带 py.typed，但 mypy 2.x 会去用捆绑 typeshed 里那份**不完整的**
# docker 存根，于是 `docker.DockerClient` / `docker.from_env` 全被报成 name-defined。
# 这不是代码问题（运行时完全正常），是存根与库版本错配。
# 两个选择：给存根提 PR，或者明确「不要跟这个包的存根」。
# follow_imports=skip 让 mypy 把 docker 当 Any 处理 —— 与 ignore_missing_imports
# 的意图一致，但那个开关对「**有**存根只是存根不全」的包不生效，必须用这个。
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: 集成测试（依赖真实 DB/Redis/MinIO fixture）",
]
