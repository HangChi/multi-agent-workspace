# 003 T063 real Worker/HTTP/API deployment acceptance overlay.
#
# Layered on top of deploy/docker-compose.verify.yml with a dedicated project so
# the 002 native acceptance stack, its compose configuration and its network
# topology stay byte-for-byte unchanged:
#   docker compose --env-file /dev/null -p <project> \
#     -f deploy/docker-compose.verify.yml -f deploy/docker-compose.external.yml \
#     --profile external up -d --wait mcp-fixture
#
# Why a fixture network on a globally routable subnet: the Worker re-validates
# every MCP endpoint through the unchanged production policy
# (app/executors/mcp_security.py), which rejects loopback, link-local, private
# and reserved addresses. Weakening that policy to make a test fixture reachable
# is explicitly forbidden by specs/003-mcp-tool-market/quickstart.md, so the
# fixture instead owns a real Docker bridge address inside 192.88.99.0/24.
#
# 192.88.99.0/24 is the deprecated 6to4 relay anycast prefix (RFC 7526): no
# production service may use it, it is not a private/reserved range in Python's
# ipaddress module, and the /24 route exists only inside this Docker bridge on
# the acceptance host. The Worker therefore performs a real TLS connection to a
# real globally valid address over a real network path, with no production
# validation relaxed and no test transport injected.

networks:
  fixture-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.88.99.0/24
          gateway: 192.88.99.1

services:
  # The acceptance bootstrap runs inside this image against the same isolated
  # database; it needs the acceptance marker and the fixture secret it checks
  # for leaks. Both arrive only from the calling process environment.
  migrate:
    environment:
      AW_VERIFY_EXTERNAL: ${AW_VERIFY_EXTERNAL:-0}
      AW_VERIFY_FIXTURE_SECRET: ${AW_VERIFY_FIXTURE_SECRET:-}

  mcp-fixture:
    image: python:3.12-slim
    profiles: [external]
    command:
      - python
      - /app/mcp_fixture_server.py
      - --host
      - '0.0.0.0'
      - --port
      - '443'
      - --scenario
      - normal
      - --client-deadline-seconds
      # Must stay slightly below the Worker's MCP_CALL_TIMEOUT_SECONDS below: a
      # call the Worker abandoned still runs to completion in this fixture, and
      # the fixture only sees it after a handshake, so a window as long as the
      # Worker's own deadline would keep counting the call after its lease was
      # released. The harness passes timeout minus CLIENT_DEADLINE_ALLOWANCE_S.
      - '${AW_VERIFY_CALL_DEADLINE_SECONDS:-8}'
      - --tls-cert
      - /fixture-tls/fixture.crt
      - --tls-key
      - /fixture-tls/fixture.key
    volumes:
      - ./verify/mcp_fixture_server.py:/app/mcp_fixture_server.py:ro
      # Generated by the acceptance entrypoint before the stack starts; never
      # committed and never reused across runs.
      - ${AW_VERIFY_FIXTURE_TLS_DIR:?required}:/fixture-tls:ro
    networks:
      fixture-net:
        ipv4_address: 192.88.99.2
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl,urllib.request;urllib.request.urlopen('https://127.0.0.1:443/health',context=ssl.create_default_context(cafile='/fixture-tls/ca-bundle.pem'),timeout=3).read()"
      interval: 3s
      timeout: 5s
      retries: 20

  worker:
    # The Worker is the only process that connects to MCP endpoints: validation
    # runs as a Celery task and invocation runs inside the run executor.
    networks:
      default: {}
      fixture-net: {}
    environment:
      # httpx honours SSL_CERT_FILE for its default trust store, so the Worker
      # trusts the fixture CA without any image rebuild or product change. The
      # bundle also carries the system roots the Worker already trusts.
      SSL_CERT_FILE: /fixture-tls/ca-bundle.pem
      MCP_ALLOWED_PORTS: '443'
      # Bounds how long a deliberately slow fixture call may hold a Worker slot.
      # The timeout path itself is still exercised for real.
      MCP_CALL_TIMEOUT_SECONDS: '10'
    volumes:
      - ${AW_VERIFY_FIXTURE_TLS_DIR:?required}:/fixture-tls:ro
