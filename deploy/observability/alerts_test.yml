# Prometheus 告警规则的行为测试（`promtool test rules`）。
#
# 为什么需要：`deploy/verify/test_alert_rules.py` 只校验「表达式引用的指标名与
# metrics.py 一致」和「规则带 severity/for/summary」。它能挡住指标改名，但挡不住
# **阈值写反、for 写成 0、分母写错**——那些规则语法合法、指标名也对，只是永远
# 不响，或者一有流量就响。
#
# 本文件构造时间序列验证每条规则的**触发行为**：该响的时候响，不该响的时候不响。
# 阈值是否贴合真实负载仍需真机调优（那是产品决策），但「规则有没有按写的逻辑
# 工作」可以在这里钉死。
#
# ⚠️ promtool 要求 `exp_annotations` 与告警文案**逐字一致**，包括 `{{ $value }}`
# 渲染后的值（如 `4.777777777777778s`、`7200 分`）。改措辞或改输入序列时，
# 必须同步这里的期望值——这不是多余负担：告警文案是值班时唯一的信息来源，
# 改它本来就该有人看一眼。
#
# 跑法：
#   docker run --rm --entrypoint promtool \
#     -v "$PWD/deploy/observability:/cfg:ro" -w /cfg \
#     prom/prometheus:v3.14.0 test rules alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # ---------- AwApiDown：up == 0 持续 2m ----------
  - interval: 1m
    input_series:
      - series: 'up{job="aw-api",instance="api:8000"}'
        values: '1 1 1 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: AwApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: aw-api
              instance: api:8000
            exp_annotations:
              summary: 'Agent 工作台 API 不可达'
              description: 'Prometheus 连续 2 分钟抓不到 api:8000/metrics。先看容器状态与 /api/v1/health/ready。'
      # 第 3 分钟刚变 0，for=2m 还没满，不应触发
      - eval_time: 3m
        alertname: AwApiDown
        exp_alerts: []

  # ---------- AwApiHighErrorRate：5xx 占比 > 5%，持续 5m ----------
  - interval: 1m
    input_series:
      # 5xx 10/s，总 100/s → 10%
      - series: 'aw_http_requests_total{method="GET",route="/api/v1/runs",status="500"}'
        values: '0+600x20'
      - series: 'aw_http_requests_total{method="GET",route="/api/v1/runs",status="200"}'
        values: '0+5400x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: AwApiHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 'API 5xx 比例超过 5%'
              description: '5 分钟窗口内 5xx 占比 10%。先按 X-Request-ID 回查结构化日志。'
      - eval_time: 3m
        alertname: AwApiHighErrorRate
        exp_alerts: []

  # 健康流量（1% 5xx）不应触发
  - interval: 1m
    input_series:
      - series: 'aw_http_requests_total{method="GET",route="/api/v1/runs",status="500"}'
        values: '0+60x20'
      - series: 'aw_http_requests_total{method="GET",route="/api/v1/runs",status="200"}'
        values: '0+5940x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: AwApiHighErrorRate
        exp_alerts: []

  # ---------- AwApiSlowP95：P95 > 2s，持续 10m ----------
  - interval: 1m
    input_series:
      # 10% 的请求落在 le=1 之外 → P95 落在 (1,5]，插值得 4.777…s
      - series: 'aw_http_request_duration_seconds_bucket{method="GET",route="/api/v1/runs",le="1"}'
        values: '0+600x20'
      - series: 'aw_http_request_duration_seconds_bucket{method="GET",route="/api/v1/runs",le="5"}'
        values: '0+6000x20'
      - series: 'aw_http_request_duration_seconds_bucket{method="GET",route="/api/v1/runs",le="+Inf"}'
        values: '0+6000x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: AwApiSlowP95
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'API P95 延迟超过 2s'
              description: '当前 P95 = 4.777777777777778s。常见原因：数据库连接池耗尽、MinIO/Redis 卡住、事件循环被同步调用阻塞。'
      - eval_time: 5m
        alertname: AwApiSlowP95
        exp_alerts: []

  # ---------- AwQueueBacklog：队列 > 50，持续 10m ----------
  - interval: 1m
    input_series:
      - series: 'aw_celery_queue_depth'
        values: '0 10 20 60 60 60 60 60 60 60 60 60 60 60 60'
    alert_rule_test:
      - eval_time: 14m
        alertname: AwQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'Celery 队列积压 60 个任务'
              description: '持续 10 分钟积压说明 Worker 消费不过来或已挂：先看 aw-worker 的 inspect ping 与并发配置。'
      # 只有 30，低于阈值 50
      - eval_time: 3m
        alertname: AwQueueBacklog
        exp_alerts: []

  # ---------- AwRunFailureRate：失败+超时占比 > 30%，持续 15m ----------
  - interval: 1m
    input_series:
      # 40% failed + 10% timeout = 50%
      - series: 'aw_run_terminal_total{status="failed"}'
        values: '0+2400x45'
      - series: 'aw_run_terminal_total{status="timeout"}'
        values: '0+600x45'
      - series: 'aw_run_terminal_total{status="succeeded"}'
        values: '0+3000x45'
    alert_rule_test:
      - eval_time: 35m
        alertname: AwRunFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'Run 失败率超过 30%'
              description: '15 分钟窗口内失败+超时占比 50%。先看是否集中在某个 Agent/模型。'
      - eval_time: 10m
        alertname: AwRunFailureRate
        exp_alerts: []

  # ---------- AwLlmErrorRate：error+timeout 占比 > 20%，持续 10m ----------
  - interval: 1m
    input_series:
      - series: 'aw_llm_calls_total{model="gpt-4o-mini",outcome="error"}'
        values: '0+1200x30'
      - series: 'aw_llm_calls_total{model="gpt-4o-mini",outcome="timeout"}'
        values: '0+600x30'
      - series: 'aw_llm_calls_total{model="gpt-4o-mini",outcome="ok"}'
        values: '0+4200x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AwLlmErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 'LLM 调用失败率超过 20%'
              description: '失败或超时占比 30%。检查上游额度、网络与 LLM_TIMEOUT_SECONDS 是否过小。'
      - eval_time: 5m
        alertname: AwLlmErrorRate
        exp_alerts: []

  # ---------- AwSandboxFailureRate：非 ok 执行速率 > 0.2/s，持续 15m ----------
  - interval: 1m
    input_series:
      # 5/s 非 ok（整数且在浮点里精确，避免 0.9999999999999999 这类渲染误差）
      - series: 'aw_sandbox_executions_total{status="failed"}'
        values: '0+300x45'
      - series: 'aw_sandbox_executions_total{status="ok"}'
        values: '0+60x45'
    alert_rule_test:
      - eval_time: 30m
        alertname: AwSandboxFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: '沙箱非成功执行速率 5/s'
              description: '持续失败通常是镜像缺失、磁盘/内存配额被打满，或出网策略挡了必需域名。'
      - eval_time: 5m
        alertname: AwSandboxFailureRate
        exp_alerts: []

  # ---------- AwDailyLlmCost：24h 增量 > 5000 分，持续 30m ----------
  # 1h 间隔：每小时 +300 分，24h 累计 7200 分 > 5000（50 元）
  - interval: 1h
    input_series:
      - series: 'aw_llm_cost_cents_total{model="gpt-4o-mini"}'
        values: '0+300x30'
    alert_rule_test:
      - eval_time: 28h
        alertname: AwDailyLlmCost
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: '近 24 小时 LLM 成本超过 50 元'
              description: '当前 7200 分。检查是否有 Agent 的 max_steps/成本上限设置过宽，或上下文裁剪失效。'

  # 低成本（每小时 +100 分 → 24h 累计 2400 < 5000）不应触发
  - interval: 1h
    input_series:
      - series: 'aw_llm_cost_cents_total{model="gpt-4o-mini"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 28h
        alertname: AwDailyLlmCost
        exp_alerts: []
