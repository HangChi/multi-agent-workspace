[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: 集成测试（依赖真实 DB/Redis/MinIO fixture）

# 覆盖率门禁。
#
# 依据：当前实测 81%（app/ 全量，未计覆盖率的分支）。门槛设在 75%，
# 留 6 个点余量 —— 低于这个数说明新增代码基本没测，高于它则允许
# 个别分支（异常兜底、平台相关分支）不覆盖。
#
# 为什么不设 --cov-fail-under 在 addopts 里：
# 想让它「默认跑」但又能单独跑不带覆盖率的快速循环（pytest -p no:cacheprovider），
# 因此门槛写在 [coverage:report] fail_under，由 CI 步骤显式带 --cov 触发。
[coverage:run]
source = app
# 不再把 tests/ 计入统计（source=app 已限定），
# __init__.py 全是空包声明，omit 掉只影响分母不掩盖风险。
omit =
    */__init__.py

[coverage:report]
fail_under = 75
# 只报未满分的文件，避免 80 行「100%」噪音淹没真正需要关注的模块
skip_covered = True
skip_empty = True
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
    if __name__ == .__main__.:
