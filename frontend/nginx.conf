# 前端 nginx 配置（T081）：SPA fallback + /api 与 /ws 反代到后端。
# 后端地址固定为 compose 服务名 `api`（同网络，端口 8000）。
#
# ⚠️ 上游地址走变量 + Docker 内嵌 DNS（127.0.0.11）动态解析：
#   直接写 `proxy_pass http://api:8000` 时 nginx 只在启动时解析一次，
#   api 容器重建换 IP 后前端会持续 502（必须重启 frontend 才恢复）。
#   用变量式 proxy_pass 才会按 valid=10s 重新解析。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api 反向代理到后端（含 WS 升级头）
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # /ws 反向代理（WebSocket）
    location /ws/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
