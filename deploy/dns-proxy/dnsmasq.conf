# 受控 DNS 代理（002-sandboxed-tools，research R-02 第 2 层）。
#
# 两个职责：
#   1. **记录**：`log-queries` 把每次查询打到 stdout（`log-facility=-`），
#      Docker 收集为容器日志。Worker 在执行结束后按「客户端 IP + 时间窗」
#      捞出本次执行的域名，用来给 conntrack 记到的真实 IP 反查域名。
#   2. **黑名单**：`/etc/dnsmasq.d/blacklist.conf` 里的域名直接 NXDOMAIN，
#      比等 iptables 拦在 TCP 层更早给出可读失败。
#
# ⚠️ 这层只是「可读性 + 第一道闸」，**不是**强制边界。强制边界是 iptables
#    （直连 IP、非常规端口、改 /etc/resolv.conf 都绕不过内核规则）。
#    所以这里配错不会导致越权，只会让审计日志少了域名。
#
# ⚠️ **本服务是全局共享的，配置只在部署时定，运行期不按执行改写。**
#    原因：并发执行改写同一份配置会互相覆盖（后写的赢），还会引入重载竞态。
#    因此 Agent 级「限制模式」不在这里实现 —— 它在每次执行独立的 iptables
#    规则里落实（见 deploy/sbx-net/README.md 的 restricted 段落）。
#    这里只承载**管理员维护的全局黑名单**，变更走 `docker compose restart dns-proxy`。
#
# 上游 DNS：故意 `no-resolv`，不用容器自带的 resolv.conf。
# 原因：Docker 内置 DNS（127.0.0.11）能解析本 compose 网络里的服务名
# （postgres / redis / minio ...），一旦沙箱能解析这些名字，等于把内网拓扑
# 暴露给用户脚本。这里只转发到公网 DNS，内网域名一律不解析。

port=53

# 不读 /etc/resolv.conf，不用 /etc/hosts
no-resolv
no-hosts
no-poll

# 上游：公网 DNS（运维可按需改；见 deploy/dns-proxy/README.md）
server=223.5.5.5
server=119.29.29.29

# 只转发含点的域名；反查私有网段直接拒
domain-needed
bogus-priv

# 记录：每次查询一行到 stdout（stderr 合并，docker logs 可见）。
# 必须用 `=extra`：普通 `log-queries` 只记 forwarded/reply，**不带客户端 IP**，
# 而 Worker 要按「客户端 IP + 时间窗」把 conntrack 的目标 IP 反查成域名。
# extra 模式的 query 行格式：`query[A] example.com from 172.18.0.5`
log-queries=extra
log-facility=-

# 缓存：减少上游压力。注意副作用——同一执行内重复查询同一域名只记一条日志，
# 用于「IP → 域名」反查足够，但**不能**用来统计访问次数（次数看 conntrack）。
cache-size=1000

# 黑名单目录（*.conf）：blacklist.conf 由部署/运维维护，不随执行变化
conf-dir=/etc/dnsmasq.d,*.conf
