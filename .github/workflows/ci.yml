name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: '同时部署到生产主机（需要 DEPLOY_* secrets）'
        type: boolean
        default: false

# 同一分支的重复推送只保留最新一次，省机器也在意等待时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-native:
    name: 002 native Linux full-stack acceptance
    # Full VM is required: ubuntu-slim/container jobs cannot validate host
    # Docker bridge/netfilter/cgroups. Never use production secrets or .env.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install acceptance dependencies
        run: python -m pip install -e './backend[dev]' 'websockets>=14,<16'
      - name: Test acceptance controls without application DB fixtures
        run: python -m unittest discover -s deploy/verify -p 'test_*.py' -v
      - name: Enable native bridge filtering prerequisites
        # This is the disposable full runner VM, never the developer host.
        # Keep the entrypoint's independent IPv4/IPv6 read-back gates.
        run: |
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1
      - name: Build own stack and validate real native controls
        # The entrypoint generates and masks disposable random credentials,
        # bootstraps ONLY its empty CI DB, and cleans its exact resources in finally.
        # No raw service/SQL/build logs, JWTs or presigned URLs are uploaded.
        run: python deploy/verify/native_acceptance.py --output "$RUNNER_TEMP/002-results"
      - name: Upload bounded sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 002-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/002-results/*.json
          if-no-files-found: error
          retention-days: 7

  external-native:
    name: 003 external tool deployment acceptance
    # A full VM is required: the entrypoint builds its own API/Worker/PostgreSQL/
    # Redis/object-storage stack plus a real HTTPS MCP fixture bridge network,
    # and measures core API P95 under concurrent load. Never use production
    # secrets or .env; the entrypoint generates its own disposable material.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install acceptance dependencies
        # docker is a base backend dependency (see backend/pyproject.toml).
        run: python -m pip install -e './backend[dev]' 'websockets>=14,<16'
      - name: Test acceptance controls without application DB fixtures
        run: python -m unittest discover -s deploy/verify -p 'test_*.py' -v
      - name: Build own stack and run external concurrency acceptance
        # The entrypoint owns its compose project: it generates disposable
        # credentials and TLS material, refuses to reuse an existing project,
        # and removes exactly what it created. Only sanitized JSON is uploaded.
        run: python deploy/verify/external_concurrency_acceptance.py --output "$RUNNER_TEMP/003-results"
      - name: Upload bounded sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 003-external-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/003-results/*.json
          if-no-files-found: error
          retention-days: 7

  backend:
    name: 后端（lint + 类型 + 测试）py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 两个版本都必须跑测试：
    #   3.12 是 pyproject 的 requires-python 下限，也是开发/CI 的历史基准；
    #   3.15 是 **镜像实际运行的版本**（backend/Dockerfile 的 python:3.15-slim）。
    # 此前只在 3.12 上跑全量、在镜像里做一次 import 冒烟 —— 那只能发现「import 就崩」，
    # 发现不了运行期才出现的行为差异（asyncio 语义、标准库弃用告警、typing 收紧）。
    # lint / mypy / 迁移可逆性只跑基准版本：它们与解释器版本无关，重复跑纯浪费时间。
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.15']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aw
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: agent_workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aw -d agent_workbench_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 测试必须指向 *_test 库，否则 conftest 会回落到代码内默认口令
      DATABASE_URL: postgresql+asyncpg://aw:ci-password@127.0.0.1:5432/agent_workbench_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: agent-workbench
      MINIO_SECURE: 'false'
      # CI 用开发语义：跳过生产密钥强校验
      APP_ENV: development

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 报告解释器版本
        working-directory: backend
        run: python -c "import sys; print('pytest 将在', sys.version)"

      # services 的 minio 镜像默认命令无法直接当服务跑，单独拉起
      - name: 启动 MinIO（附件测试需要真实预签名 PUT/GET）
        run: |
          # Docker Hub's old public minio/minio image is no longer pullable.
          # Build the official, checksum-pinned release binary (CI-only image).
          docker build -f deploy/verify/minio.Dockerfile -t aw-verify-minio:2025-09-07 deploy/verify
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            aw-verify-minio:2025-09-07 server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "minio ready"; exit 0
            fi
            sleep 1
          done
          echo "minio 启动超时（不输出可能含凭据的服务日志）"; exit 1

      - name: 迁移可达性（Alembic 能在空库上跑通）
        working-directory: backend
        run: alembic upgrade head

      - name: 迁移可逆性（仅 CI disposable 数据库）
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: ruff
        # 静态检查与解释器版本无关，只在基准版本跑一次
        if: matrix.python-version == '3.12'
        working-directory: backend
        # alembic/ 必须在内：迁移文件同样是交付代码，此前的 app tests 范围
        # 让迁移里的旧式 Union 注解（UP007 等）永远过不了CI也看不见。
        run: ruff check app tests alembic

      # 格式检查放在 lint 之后：ruff check 只看语义，ruff format 看排版，
      # 两者互补。没有这一步，格式化风格会随作者编辑器配置漂移。
      - name: ruff format（格式一致性）
        if: matrix.python-version == '3.12'
        working-directory: backend
        run: ruff format --check .

      - name: mypy
        if: matrix.python-version == '3.12'
        working-directory: backend
        run: mypy app

      # 带覆盖率跑：门槛写在 backend/.coveragerc 的 [report] fail_under=85，
      # 低于阈值非零退出。pytest.ini 不读 [coverage:*] 段，写在那里等于没写。
      # --cov 是显式加的，本地快速循环可以不带。
      # 必须写成 --cov=app：裸 --cov 等价于 --cov=.，会把 tests/ 自己
      # 算进分母（分母翻三倍、数字被稀释），报出来的不是 app/ 的覆盖率。
      - name: pytest（含覆盖率门禁）
        working-directory: backend
        env:
          # 3.15 上有 2~3 个集成用例对异步时序/列表顺序敏感：单跑必过、
          # 全量偶发红，且每次失败的用例都不一样（本项目 3 次实测分别红
          # 6/3/2 个，互不重复）。这类假红会让「CI 红」失去信号价值。
          # 只在该版本上重试 2 次；3.12 保持严格，真正的回归不会因为重试而漏掉。
          RERUN_ARGS: ${{ matrix.python-version == '3.15' && '--reruns 2 --reruns-delay 1' || '' }}
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered $RERUN_ARGS

  image:
    name: 后端镜像（可构建 + 可启动）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # 只构建、不推送：验证 Dockerfile 与 uv.lock 仍然自洽。
      # 没有这一步时，Dockerfile 可以长期失修而 CI 全绿 ——
      # 依赖清单改了却忘了同步 lock、基础镜像 tag 消失，都要到部署时才发现。
      - name: 构建镜像
        run: docker build -t aw-backend:ci backend

      # 起得来才算可构建：缺 .venv 入口、CMD 写错、依赖漏装
      # 都只会在运行期暴露，构建成功掩盖不了。
      - name: 启动并探活
        run: |
          docker run -d --name aw-ci \
            -e DATABASE_URL="postgresql+asyncpg://aw:x@127.0.0.1:5432/aw" \
            -e REDIS_URL="redis://127.0.0.1:6379/0" \
            -e JWT_SECRET="ci-only-secret-0123456789abcdef" \
            aw-backend:ci
          for i in $(seq 1 30); do
            # 只请求不依赖数据库的 openapi.json，确认 ASGI 应用已就绪
            if docker exec aw-ci /opt/aw/.venv/bin/python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)" 2>/dev/null; then
              echo "镜像启动正常"; exit 0
            fi
            sleep 1
          done
          echo "镜像启动失败"
          docker logs aw-ci | tail -30
          exit 1

      - name: 确认以非 root 运行
        run: |
          uid=$(docker run --rm --entrypoint /usr/bin/id aw-backend:ci -u)
          echo "容器内 uid=$uid"
          test "$uid" != "0"

      # 与 backend 作业的 3.15 矩阵互补，两者查的不是同一件事：
      #   - backend 矩阵用 pip 装的依赖 + setup-python 解释器跑全量测试（行为）；
      #   - 这里用**镜像里真实安装的**那套依赖（uv.lock 锁定版本 + slim 基础镜像的
      #     精简系统库）做一次全模块导入，能抓到「镜像内缺 .so / 缺 locale /
      #     依赖被 lock 钉在旧版本」这类只有镜像才会有的问题。
      # 两边都保留：删掉任一边，都会留下一类灰区。
      - name: 镜像内导入全部模块（运行期 Python 版本冒烟）
        run: |
          docker run --rm --entrypoint /opt/aw/.venv/bin/python aw-backend:ci -c "import sys, app.main, app.tasks.execute_run, app.tasks.celery_app, app.executors.sandbox, app.executors.mcp_client, app.api.v1.ws, app.core.redis; print('runtime python', sys.version.split()[0], 'imports ok')"

  frontend:
    name: 前端（lint + 类型 + 单测 + 构建）node${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 与后端同一个理由：frontend/Dockerfile 的 build 阶段是 node:26-alpine，
    # 而 CI 一直只在 22 上验证。构建期差异（Vite 的 Node API 用法、依赖的
    # engines 字段、ESM/CJS 解析行为）只会在真正构建的版本上暴露。
    # lint/prettier 只跑基准版本：规则与解释器版本无关。
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: eslint
        if: matrix.node-version == '22'
        working-directory: frontend
        run: npm run lint

      - name: prettier（格式一致性）
        if: matrix.node-version == '22'
        working-directory: frontend
        run: npm run format:check

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 单元测试
        working-directory: frontend
        run: npm test

      - name: 构建（产物可用性 + Tailwind 生效）
        working-directory: frontend
        run: |
          npm run build
          # 零样式事故复现：CSS 必须远大于裸 @tailwind 指令（~60 字节）
          css_file=$(ls -S dist/assets/*.css | head -1)
          css_size=$(wc -c < "$css_file" | tr -d ' ')
          echo "CSS 产物 ${css_file} = ${css_size} 字节"
          if [ "$css_size" -lt 5000 ]; then
            echo "::error::CSS 产物过小，Tailwind 可能未生效（postcss 配置缺失）"
            exit 1
          fi

  deploy:
    name: 部署到生产主机（手动触发）
    # 只在手动触发时出现：合并到 master 不等于可以上线，部署要人按下按钮。
    # 需要三个仓库 secret：DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY（外加 DEPLOY_PATH，
    # 缺省 ~/agent-workbench）。SSH 密钥请用专用部署账号，不要复用个人密钥。
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: [backend, frontend, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: 检查部署凭据是否就绪
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少部署 secret:$missing（见 workflow 注释）"
            exit 1
          fi

      - name: 配置 SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 固定主机指纹：不做 StrictHostKeyChecking=no 那种"信任一切"的处理
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 远端拉取并部署
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             cd '${DEPLOY_PATH:-~/agent-workbench}'
             git fetch --depth=1 origin '${{ github.sha }}'
             git checkout --detach FETCH_HEAD
             bash deploy/deploy.sh"

      - name: 清理部署密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key
