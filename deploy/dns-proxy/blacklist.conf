# 全局出站黑名单（002-sandboxed-tools，spec FR-021）。
#
# 由管理员维护；成员与 Agent 配置都不能放宽（求值顺序：全局 deny 优先）。
# 格式：dnsmasq 的 address 指令，返回 NXDOMAIN。
#   address=/<domain>/            → 该域名及其子域
#
# ⚠️ 这一层是「第一道闸 + 可读失败」，**不是**强制边界：
#    沙箱直连 IP 不查 DNS 就绕过了。强制边界是 iptables 的 CIDR 黑名单
#    （EGRESS_BUILTIN_BLACKLIST，覆盖内网段与云元数据 169.254.169.254）。
#    所以这里主要拦「已知的恶意/不必要域名」，别把它当安全边界用。
#
# 改完生效：docker compose -p aw -f deploy/docker-compose.yml restart dns-proxy
#
# 示例（默认全部注释，按需启用）：
# address=/metadata.google.internal/
# address=/instance-data/
