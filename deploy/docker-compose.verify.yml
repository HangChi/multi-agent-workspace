# Isolated 002 acceptance only. Never points at deploy/.env or developer data.
# Build application images first; invoke with -p aw-002-verify.
# Secrets are supplied by the caller and must not be committed.
x-app-env: &app-env
  APP_ENV: development
  LOG_LEVEL: warning
  DATABASE_URL: postgresql+asyncpg://verify:${AW_VERIFY_PASSWORD:?required}@postgres:5432/aw_verify
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_SECRET: ${AW_VERIFY_JWT_SECRET:?required}
  INVITE_CODE: ${AW_VERIFY_INVITE_CODE:?required}
  MINIO_ENDPOINT: ${AW_VERIFY_MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: verifyadmin
  MINIO_SECRET_KEY: ${AW_VERIFY_PASSWORD:?required}
  MINIO_BUCKET: sandbox-verify
  MINIO_SECURE: 'false'
  LLM_API_KEY: mock-only
  LLM_MODEL: gpt-4o-mini
  LLM_BASE_URL: http://llm-gateway:4000/v1
  DB_POOL: 'null'
  SEARCH_API_URL: http://llm-gateway:4000/search
  AW_VERIFY_CI: ${AW_VERIFY_CI:-0}
  AW_VERIFY_USER_PASSWORD: ${AW_VERIFY_USER_PASSWORD:-}
  SBX_MEM_MB: ${AW_VERIFY_SBX_MEM_MB:-512}
  SBX_DISK_MB: ${AW_VERIFY_SBX_DISK_MB:-256}
  SBX_PIDS: ${AW_VERIFY_SBX_PIDS:-128}
  SBX_MAX_CONCURRENCY: ${AW_VERIFY_SBX_CONCURRENCY:-4}
  SBX_NETWORK_PREFIX: ${AW_VERIFY_SBX_PREFIX:-aw-002-sbx}
  EGRESS_DNS_PROXY: ${AW_VERIFY_DNS_NAME:-aw-002-verify-dns}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: ${AW_VERIFY_PASSWORD:?required}
      POSTGRES_DB: aw_verify
    volumes:
      - verify-pg:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'verify', '-d', 'aw_verify']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: aw-verify-minio:2025-09-07
    command: server /data
    environment:
      MINIO_ROOT_USER: verifyadmin
      MINIO_ROOT_PASSWORD: ${AW_VERIFY_PASSWORD:?required}
    volumes:
      - verify-objects:/data
    ports:
      # CI binds the Docker bridge gateway so presigned redirects work unchanged
      # both in containers and on the runner, never the public runner interface.
      - '${AW_VERIFY_MINIO_BIND:-127.0.0.1}:${AW_VERIFY_MINIO_PORT:-19000}:9000'
    mem_limit: 384m
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:9000/minio/health/live",timeout=2)']
      interval: 2s
      timeout: 3s
      retries: 30
  dns-proxy:
    image: aw-dns-proxy:1
    container_name: ${AW_VERIFY_DNS_NAME:-aw-002-verify-dns}
    mem_limit: 64m
  llm-gateway:
    image: python:3.12-slim
    command: python /app/server.py
    volumes:
      - ./mock-llm:/app:ro
    mem_limit: 128m
  migrate:
    image: aw-migrate:latest
    command: alembic upgrade head
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  api:
    image: aw-api:latest
    environment: *app-env
    mem_limit: 768m
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready",timeout=3)']
      interval: 2s
      timeout: 5s
      retries: 30
  worker: &worker
    image: aw-worker:latest
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=warning --concurrency=${AW_VERIFY_WORKERS:-2} --prefetch-multiplier=1
    environment: *app-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - '${DOCKER_SOCK_GID:-0}'
    mem_limit: ${AW_VERIFY_WORKER_MEMORY:-1g}
    depends_on:
      api:
        condition: service_healthy
      dns-proxy:
        condition: service_started
      llm-gateway:
        condition: service_started
  worker-infra:
    <<: *worker
    profiles: [faults]
    environment:
      <<: *app-env
      SBX_IMAGE: aw-verify-deliberately-missing:002
      SBX_ALLOWED_IMAGES: aw-verify-deliberately-missing:002
  worker-quota:
    <<: *worker
    profiles: [faults]
    environment:
      <<: *app-env
      SBX_MAX_CONCURRENCY: '1'
  frontend:
    image: aw-frontend:latest
    ports:
      - '127.0.0.1:${AW_VERIFY_PORT:-8180}:80'
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy

volumes:
  verify-pg:
  verify-objects:
