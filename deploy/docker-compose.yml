# Agent Workbench 完整部署（T080）：基础设施 + api/worker/beat/frontend。
#
# 用法：
#   cp deploy/.env.example deploy/.env   # 按需修改密钥
#   docker compose -p aw -f deploy/docker-compose.yml up -d --build
#   本地离线验证（含 Mock LLM 网关）：追加 --profile mock
#
# 密钥策略：所有敏感配置经 ${VAR} 从 .env 注入，不落镜像。
# 服务依赖：api/worker/beat 依赖 postgres/redis/minio（healthcheck）；
# frontend 依赖 api（反代目标 api:8000）。
#
# 资源与日志：每个服务限制 CPU/内存（防止单个失控 Run 拖垮整机）+ 日志轮转
# （json-file 无限增长会撑爆磁盘）。

# 日志轮转（所有服务共用）：单文件 10MB × 3 份
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ---------- 基础设施 ----------
  postgres:
    image: postgres:16-alpine
    container_name: aw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aw-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-agent_workbench}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aw} -d ${POSTGRES_DB:-agent_workbench}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aw-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: aw-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Mock LLM 网关（仅验证用，默认不启动）----------
  # OpenAI 兼容 /v1/chat/completions，用于无真实密钥时跑通执行链路。
  # ⚠️ 生产绝不可启用（会返回假结果，让人误以为系统正常）。
  # 启动方式：docker compose --profile mock up -d
  llm-gateway:
    image: python:3.12-slim
    container_name: aw-llm-gateway
    restart: unless-stopped
    profiles: ['mock']
    command: python /app/server.py
    environment:
      PORT: '4000'
      MOCK_LLM_MODE: ${MOCK_LLM_MODE:-auto}
    volumes:
      - ./mock-llm:/app:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4000/health", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- 应用服务 ----------
  # 一次性迁移：建表（alembic upgrade head），api/worker/beat 依赖其完成
  migrate:
    build:
      context: ../backend
    container_name: aw-migrate
    command: alembic upgrade head
    environment: &app_env
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      INVITE_CODE: ${INVITE_CODE}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MONTHLY_QUOTA_CENTS: ${MONTHLY_QUOTA_CENTS:-1000000}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  api:
    build:
      context: ../backend
    container_name: aw-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      INVITE_CODE: ${INVITE_CODE}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MONTHLY_QUOTA_CENTS: ${MONTHLY_QUOTA_CENTS:-1000000}
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      # 就绪探针：DB + Redis 均可达才算健康（/health 只判进程存活）
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health/ready\", timeout=3)"']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 不暴露 8000 到宿主机：仅经 frontend(nginx)/Caddy 反代访问
    expose:
      - '8000'

  worker:
    build:
      context: ../backend
    container_name: aw-worker
    restart: unless-stopped
    # 并发度可配：每个任务会调 LLM + 工具，过高会同时打满 API 限流与内存
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=${LOG_LEVEL:-info} --concurrency=${WORKER_CONCURRENCY:-2}
    # Celery worker 用 asyncio.run 每次新建事件循环：DB 连接池会跨 loop 复用报错，
    # 因此强制 NullPool（每个连接独立，天然适配任意 loop）。
    environment:
      <<: *app_env
      DB_POOL: 'null'
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'celery -A app.tasks.celery_app:celery_app inspect ping 2>&1 | grep -q "pong"']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: ../backend
    container_name: aw-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=${LOG_LEVEL:-info}
    # beat 也会执行 DB 任务（僵尸 Run 回收），同样需要 NullPool（与 worker 同理）
    environment:
      <<: *app_env
      DB_POOL: 'null'
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import redis,os; r=redis.from_url(os.environ[\"REDIS_URL\"]); r.ping()"']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
    container_name: aw-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  miniodata:
