# 前端 nginx 配置（T081）：SPA fallback + /api 与 /ws 反代到后端。
# 后端地址固定为 compose 服务名 `api`（同网络，端口 8000）。
#
# ⚠️ 上游地址走变量 + Docker 内嵌 DNS（127.0.0.11）动态解析：
#   直接写 `proxy_pass http://api:8000` 时 nginx 只在启动时解析一次，
#   api 容器重建换 IP 后前端会持续 502（必须重启 frontend 才恢复）。
#   用变量式 proxy_pass 才会按 valid=10s 重新解析。

# 访问日志格式：只记 $uri（路径），**不记 query string**。
#
# 官方镜像默认的 `log_format main` 用的是 `"$request"`（完整请求行，含 ?query）。
# 前端 WS 握手原先用 `/ws/runs/{id}?token=<access>` 传凭证，于是 token 会被反代
# 这层先写进容器日志（json-file → /dev/stdout），绕过后端 middleware 的脱敏。
# 因此这里全局换成不带 query 的格式。
#
# 2026-11-17 起前端改用 `Sec-WebSocket-Protocol: aw.bearer, <jwt>` 传凭证
# （见 frontend/src/hooks/useRunSocket.ts + backend/app/api/v1/ws.py），URL 里
# 不再有 token。后端仍保留 `?token=` 回退以兼容旧页面/旧客户端，所以这条日志
# 降噪仍需保留，不能因为换了传递方式就撤掉。
#
# error_log 的格式是 nginx 内建的、**无法自定义**，上游失败时（DNS 失败/连接
# 被拒/超时）它会打印完整请求行。改用子协议后，正常路径上已没有 query 凭证
# 可泄漏；仅当旧客户端仍在用 `?token=` 且恰好遇到上游故障时才会落盘。
log_format aw_main '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" rt=$request_time';

# ⚠️ 已知残留风险：error_log 的格式是 nginx 内建的、**无法自定义**，上游失败时
#   （DNS 失败/连接被拒/超时）它会打印含 query 的完整请求行，例如：
#     [error] api could not be resolved ... request: "GET /ws/runs/x?token=..."
#   即 token 仍可能在**上游异常时**进入 error 日志（正常代理成功不打印）。
# 彻底解法是不要用 URL 承载凭证（WebSocket 无法自定义 header，可改用
#   Sec-WebSocket-Protocol 子协议传递 + 服务端 accept(subprotocol=...) 回显）。
# 本次不在此处改协议：改动横跨前后端握手且需兼容旧连接，单独评估。
# 当前缓解：error_log 保持 error 级别（不降到 crit），以免连故障原因都看不到。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log aw_main;

    gzip on;
    gzip_types text/css application/javascript application/json;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 安全响应头。
    # ⚠️ nginx 的 add_header 继承规则：子级只要出现任意 add_header，就**不再继承**父级，
    #    所以下面每个自带 add_header 的 location 都必须重复声明这几条，否则会静默丢失
    #    （含下面的 CSP）。
    #
    # CSP 说明：token 存在 localStorage，XSS 等于长期账号接管，所以 script-src 必须收紧。
    # - script-src 'self'：不再需要 'unsafe-inline'（首屏主题脚本已外链成
    #   /theme-init.js，index.html 里没有内联脚本）
    # - style-src 保留 'unsafe-inline'：React 的 style={{...}} 走行内 style 属性
    # - connect-src 保留 http:/https:：附件与制品直传对象存储，其对外地址由
    #   MINIO_PUBLIC_ENDPOINT 决定（静态 nginx.conf 里拿不到具体域名）。
    #   注入面由 script-src 挡住，connect-src 只做粗粒度约束。
    # - ws://$host / wss://$host：WebSocket 不被 'self' 覆盖，必须显式列出
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$host wss://$host http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # /api 反向代理到后端（含 WS 升级头）
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # /ws 反向代理（WebSocket）
    # 访问日志沿用 aw_main（不含 query），保留连观测又不落 token。
    location /ws/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（hash 命名，可长期 immutable）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # 继承规则：本 location 有 add_header，上面 server 级的会失效，必须重复
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$host wss://$host http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
